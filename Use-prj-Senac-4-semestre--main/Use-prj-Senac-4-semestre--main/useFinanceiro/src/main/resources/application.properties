spring.application.name=useFinanceiro
server.port=8082
spring.datasource.url=${FINANCEIRO_DB_URL:jdbc:mysql://127.0.0.1:3306/use_financeiro}
spring.datasource.username=${FINANCEIRO_DB_USER}
spring.datasource.password=${FINANCEIRO_DB_PASSWORD}
spring.sql.init.mode=always
use.cadastros.url=${CADASTROS_URL:http://127.0.0.1:8081}

spring.mvc.problemdetails.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
